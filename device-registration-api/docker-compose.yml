version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dev

  device-registration-api:
    image: device-registration-api:1.0.0
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - dev

volumes:
  pgdata:

networks:
  dev:
    driver: bridge
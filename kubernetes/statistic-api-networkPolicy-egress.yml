apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-statistic-egress
  namespace: device-platform
spec:
  podSelector:
    matchLabels:
      app: statistic-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: device-registration-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

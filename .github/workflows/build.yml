# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Device Registration API Build and Test

on:
    push:
      branches:    
        - '**' 
        - '!main'          
    pull_request: 
      branches:
        - 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Device Registration API - Install dependencies
      run: |
        cd ./device-registration-api
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
    - name: Lint code
      continue-on-error: true
      run: |
        cd ./device-registration-api
        pip install ruff
        ruff check .
    - name: Device Registration API - Run tests
      continue-on-error: true
      run: |
        echo "Running tests"
        cd ./device-registration-api
        pip install pytest
        python -m pytest tests/ -v
  
  trivy_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Dockerfile lint (hadolint)
        continue-on-error: true
        run: |
          echo "Running lint"
          cd ./device-registration-api
          docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Build an image from Dockerfile
        continue-on-error: true
        run: |
          echo "Running trivy"
          cd ./device-registration-api
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/device-registration-api:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/device-registration-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
   
  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Device Registration API version
        id: version
        run: |
          cd ./device-registration-api
          VERSION=$(python3 -c "from app.__version__ import __version__; print(__version__)")
          echo "device-registration-api-version=$VERSION" >> $GITHUB_OUTPUT
          echo "image-tag=${VERSION}-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./device-registration-api
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/device-registration-api:${{ steps.version.outputs.image-tag }}

  

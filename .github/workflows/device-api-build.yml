name: Device Registration API Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        cd ./device-registration-api
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
    - name: Lint code
      continue-on-error: true
      run: |
        cd ./device-registration-api
        pip install ruff
        ruff check .
    - name: Run tests
      continue-on-error: true
      run: |
        cd ./device-registration-api
        pip install pytest
        python -m pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          cd ./device-registration-api
          VERSION=$(python3 -c "from app.__version__ import __version__; print(__version__)")
          echo "current=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}-$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./device-registration-api
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/device-registration-api:${{ steps.version.outputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/device-registration-api:latest

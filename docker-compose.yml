
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dev
    ports:
    - "5432:5432"

  device-registration-api:
    image: device-registration-api:1.0.0
    build: ./device-registration-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - dev
    ports:
    - "8001:8000"

  statistic-api:
    image: statistic-api:1.0.0
    build: ./statistics-api
    environment:
      DEVICE_REGISTRATION_API_URL: ${DEVICE_REGISTRATION_API_URL}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS}
    networks:
      - dev
    ports:
    - "8000:8000"

volumes:
  pgdata:

networks:
  dev:
    driver: bridge